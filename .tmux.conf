# Core behavior
set -s escape-time 5
set -g mouse on
set -g focus-events on
set -g history-limit 100000
set -g set-clipboard external
setw -g mode-keys vi

# Modern terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Prefix and copy mode
unbind C-b
set -g prefix 'C-\'
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind R source-file ~/.tmux.conf \; display-message "Tmux config reloaded."

# Only refresh terminal/session metadata on attach. Agent forwarding is disabled
# in SSH config, so agent socket variables do not need to enter tmux sessions.
set -g update-environment 'DISPLAY SSH_CONNECTION TERM'

# Alerts
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g monitor-activity on
set -g bell-action none

# Status bar
set -g status on
set -g status-interval 30
set -g status-position bottom
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 100
set -g status-style fg=colour137,bg=colour236
set -g status-left ' #S '
set -g status-right '#{?client_prefix,#[fg=colour196]PREFIX #[default],}%a, %d %b - %H:%M'

setw -g window-status-style fg=colour138,bg=colour235
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-bell-style fg=colour255,bg=colour1,bold

# Panes and messages
set -g pane-border-style fg=colour238,bg=colour235
set -g pane-active-border-style fg=colour51,bg=colour236
set -g message-style fg=colour232,bg=colour166,bold
setw -g mode-style fg=colour196,bg=colour238,bold
